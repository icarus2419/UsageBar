name: Build macOS release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build UsageBar
        run: make app VERSION="${GITHUB_REF_NAME#v}"

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/UsageBar.app UsageBar-macos.zip
          shasum -a 256 UsageBar-macos.zip > UsageBar-macos.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            UsageBar-macos.zip \
            UsageBar-macos.zip.sha256 \
            --title "UsageBar ${GITHUB_REF_NAME#v}" \
            --generate-notes
